<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6750a4" />
      <stop offset="100%" stop-color="#4f378b" />
    </linearGradient>
    <linearGradient id="oGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd8e4" />
      <stop offset="100%" stop-color="#f2b8b5" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1d192b" flood-opacity="0.28" />
    </filter>
  </defs>

  <!-- Background container with rounded corners (MD3 style) -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Subtle Board Grid -->
  <g stroke="#ffffff" stroke-opacity="0.16" stroke-width="6" stroke-linecap="round">
    <line x1="176" y1="96" x2="176" y2="416" />
    <line x1="336" y1="96" x2="336" y2="416" />
    <line x1="96" y1="176" x2="416" y2="176" />
    <line x1="96" y1="336" x2="416" y2="336" />
  </g>

  <!-- Piece X (Top Left / Center) -->
  <g filter="url(#softShadow)">
    <line x1="136" y1="136" x2="216" y2="216" stroke="#ffffff" stroke-width="26" stroke-linecap="round" />
    <line x1="216" y1="136" x2="136" y2="216" stroke="#ffffff" stroke-width="26" stroke-linecap="round" />
  </g>

  <!-- Piece O (Bottom Right / Center) -->
  <circle cx="336" cy="336" r="46" fill="none" stroke="url(#oGrad)" stroke-width="24" filter="url(#softShadow)" />

  <!-- Additional glowing accent dot -->
  <circle cx="336" cy="176" r="16" fill="#e8def8" fill-opacity="0.75" />
  <circle cx="176" cy="336" r="16" fill="#e8def8" fill-opacity="0.75" />
</svg>
